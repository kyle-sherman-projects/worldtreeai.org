title: WorldTree
tagline: Safe Data for School Success
description: >-
  WorldTree builds Lerad — a teacher dashboard that unifies student data
  across Google Classroom, PowerSchool, and AP Classroom, engineered to
  NY Ed Law §2-d standards from the first line of code.
url: https://worldtreeai.org
baseurl: ""

permalink: /blog/:title/

# Post dates are bare (date: 2026-08-01) and Jekyll resolves them against the
# build host's clock. GitHub's runners are UTC, which would make a post dated
# August 1 go live at 8pm Eastern on July 31. Pinning this makes a scheduled
# date mean midnight where the posts are actually written.
timezone: America/New_York

# Local-preview tooling — must never reach the published site
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - README.md

defaults:
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "post"

# GitHub Pages supports these two by default; no Gemfile needed.
plugins:
  - jekyll-feed
  - jekyll-sitemap
